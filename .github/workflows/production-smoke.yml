name: Cloudflare production smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify deployed application
        env:
          CLOUDFLARE_TEST_URL: https://codex-menu.pages.dev
        run: node scripts/check-cloudflare-runtime.js
